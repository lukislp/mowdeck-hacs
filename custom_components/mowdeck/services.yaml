start_mow:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower
  fields:
    area_ids:
      required: false
      example: '["zone-front", "zone-back"]'
      selector:
        text:
          multiple: true
    pattern:
      required: false
      example: '{"name": "stripes", "angle_deg": 45}'
      selector:
        object:

emergency_stop:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower

set_blade_height:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower
  fields:
    mm:
      required: true
      example: 55
      selector:
        number:
          min: 10
          max: 120
          step: 1
          unit_of_measurement: mm
          mode: slider

set_speed:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower
  fields:
    mps:
      required: true
      example: 0.6
      selector:
        number:
          min: 0.01
          max: 2
          step: 0.01
          unit_of_measurement: m/s
          mode: slider

get_map:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower

get_heatmap:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower
  fields:
    layer:
      required: true
      example: coverage
      selector:
        select:
          options:
            - coverage
            - rtk
            - wifi
            - mnet
    start:
      required: false
      selector:
        datetime:
    end:
      required: false
      selector:
        datetime:
    cell:
      required: false
      example: 1
      selector:
        select:
          options:
            - "0.5"
            - "1"
            - "2"

spot_mow:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower
  fields:
    latitude:
      required: false
      example: 48.1372
      selector:
        number:
          min: -90
          max: 90
          step: any
    longitude:
      required: false
      example: 11.5755
      selector:
        number:
          min: -180
          max: 180
          step: any
    zone:
      required: false
      example: zone.flower_bed
      selector:
        entity:
          domain: zone
    radius:
      required: false
      example: 1.5
      selector:
        number:
          min: 0.5
          max: 3
          step: 0.1
          unit_of_measurement: m
          mode: slider
    pattern:
      required: false
      default: spiral
      selector:
        select:
          options:
            - spiral
            - stripes
    angle:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 180
          step: 1
          unit_of_measurement: "°"
    speed:
      required: false
      default: 0.2
      selector:
        number:
          min: 0.1
          max: 0.3
          step: 0.05
          unit_of_measurement: m/s
    blades:
      required: false
      default: false
      selector:
        boolean:
    confirm_blades:
      required: false
      default: false
      selector:
        boolean:
    return_to_dock:
      required: false
      default: true
      selector:
        boolean:
    turn_style:
      required: false
      selector:
        select:
          options:
            - in_place
            - arc
            - multi_point
