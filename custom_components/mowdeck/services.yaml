start_mow:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower
  fields:
    area_ids:
      required: false
      example: '["zone-front", "zone-back"]'
      selector:
        text:
          multiple: true
    pattern:
      required: false
      example: '{"name": "stripes", "angle_deg": 45}'
      selector:
        object:

emergency_stop:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower

set_blade_height:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower
  fields:
    mm:
      required: true
      example: 55
      selector:
        number:
          min: 10
          max: 120
          step: 1
          unit_of_measurement: mm
          mode: slider

set_speed:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower
  fields:
    mps:
      required: true
      example: 0.6
      selector:
        number:
          min: 0.05
          max: 2
          step: 0.05
          unit_of_measurement: m/s
          mode: slider
