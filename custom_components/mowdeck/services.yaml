start_mow:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower
  fields:
    areas:
      required: false
      example: '["switch.luba_mow_front"]'
      selector:
        entity:
          multiple: true
          filter:
            integration: mowdeck
            domain: switch
    area_ids:
      required: false
      example: '["zone-front", "zone-back"]'
      selector:
        text:
          multiple: true
    pattern_settings:
      collapsed: true
      fields:
        pattern:
          required: false
          example: stripes
          selector:
            select:
              translation_key: mow_pattern
              options:
                - stripes
                - diagonal
                - checkerboard
                - edge_only
                - random_angle
        angle_deg:
          required: false
          example: 45
          selector:
            number:
              min: 0
              max: 180
              step: 1
              unit_of_measurement: "°"
              mode: box
        border_laps:
          required: false
          example: 1
          selector:
            number:
              min: 0
              max: 4
              step: 1
              mode: box
        spacing_cm:
          required: false
          example: 25
          selector:
            number:
              min: 5
              max: 200
              step: 1
              unit_of_measurement: cm
              mode: box
    cutting:
      collapsed: true
      fields:
        blade_height_mm:
          required: false
          example: 25
          selector:
            number:
              min: 10
              max: 120
              step: 1
              unit_of_measurement: mm
              mode: slider
        speed_mps:
          required: false
          example: 0.4
          selector:
            number:
              min: 0.01
              max: 2
              step: 0.01
              unit_of_measurement: m/s
              mode: slider
    job_options:
      collapsed: true
      fields:
        obstacle_detection:
          required: false
          example: sensitive
          selector:
            select:
              translation_key: obstacle_detection
              options:
                - "off"
                - slow_touch
                - less_touch
                - standard
                - sensitive
        obstacle_laps:
          required: false
          example: 1
          selector:
            number:
              min: 0
              max: 4
              step: 1
              mode: box
        order:
          required: false
          example: border_first
          selector:
            select:
              translation_key: path_order
              options:
                - border_first
                - grid_first
        start_progress_pct:
          required: false
          example: 50
          selector:
            number:
              min: 0
              max: 99
              step: 1
              unit_of_measurement: "%"
              mode: slider
    ignore_unsupported:
      required: false
      default: false
      selector:
        boolean:

get_start_options:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower

emergency_stop:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower

set_blade_height:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower
  fields:
    mm:
      required: true
      example: 55
      selector:
        number:
          min: 10
          max: 120
          step: 1
          unit_of_measurement: mm
          mode: slider

set_speed:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower
  fields:
    mps:
      required: true
      example: 0.6
      selector:
        number:
          min: 0.01
          max: 2
          step: 0.01
          unit_of_measurement: m/s
          mode: slider

get_map:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower

get_heatmap:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower
  fields:
    layer:
      required: true
      example: coverage
      selector:
        select:
          options:
            - coverage
            - rtk
            - wifi
            - mnet
    start:
      required: false
      selector:
        datetime:
    end:
      required: false
      selector:
        datetime:
    cell:
      required: false
      example: 1
      selector:
        select:
          options:
            - "0.5"
            - "1"
            - "2"

spot_mow:
  target:
    entity:
      integration: mowdeck
      domain: lawn_mower
  fields:
    latitude:
      required: false
      example: 48.1372
      selector:
        number:
          min: -90
          max: 90
          step: any
    longitude:
      required: false
      example: 11.5755
      selector:
        number:
          min: -180
          max: 180
          step: any
    zone:
      required: false
      example: zone.flower_bed
      selector:
        entity:
          domain: zone
    radius:
      required: false
      example: 1.5
      selector:
        number:
          min: 0.5
          max: 3
          step: 0.1
          unit_of_measurement: m
          mode: slider
    pattern:
      required: false
      default: spiral
      selector:
        select:
          options:
            - spiral
            - stripes
    angle:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 180
          step: 1
          unit_of_measurement: "°"
    speed:
      required: false
      default: 0.2
      selector:
        number:
          min: 0.1
          max: 0.3
          step: 0.05
          unit_of_measurement: m/s
    blades:
      required: false
      default: false
      selector:
        boolean:
    confirm_blades:
      required: false
      default: false
      selector:
        boolean:
    return_to_dock:
      required: false
      default: true
      selector:
        boolean:
    turn_style:
      required: false
      selector:
        select:
          options:
            - in_place
            - arc
            - multi_point
