# Daily dependency PRs in the same shape as the other lukislp repositories: fix(...) commit
# prefixes, at most two open PRs per ecosystem. The integration itself has no Python
# requirements (manifest.json "requirements": []); uv.lock only pins the development tools.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
      # init, analyze and upload-sarif must run the same version - one PR for all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    # pytest-homeassistant pins one Home Assistant release exactly, so both pins move in one
    # PR; a bump of only one of them can never resolve.
    groups:
      home-assistant:
        patterns:
          - "homeassistant"
          - "pytest-homeassistant"
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
