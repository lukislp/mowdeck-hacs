# Daily dependency PRs in the same shape as the other lukislp repositories: fix(...) commit
# prefixes, at most two open PRs per ecosystem. The integration itself has no Python
# requirements (manifest.json "requirements": []); uv.lock only pins the development tools.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    # A new release waits three days before Dependabot proposes it, except the lktec-bot
    # workflows: those are our own and a fix there should reach every caller right away.
    cooldown:
      default-days: 3
      exclude:
        - "lukislp/lktec-bot*"
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
      # Same for the lktec-bot workflows (automerge, lockfiles, release): one PR per release.
      lktec-bot:
        patterns:
          - "lukislp/lktec-bot*"
      # init, analyze and upload-sarif must run the same version - one PR for all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    # pytest-homeassistant pins one Home Assistant release exactly, so both pins move in one
    # PR; a bump of only one of them can never resolve.
    groups:
      home-assistant:
        patterns:
          - "homeassistant"
          - "pytest-homeassistant"
    # PyTurboJPEG mirrors the pin of Home Assistant's camera component (its manifest.json),
    # so it only moves with the Home Assistant release; a bump of its own would test against a
    # version Home Assistant does not ship, and the daily attempt only fails the job.
    ignore:
      - dependency-name: pyturbojpeg
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
