name: release

# Publishes a release of the integration. Every push to main asks semantic-release
# (.releaserc.json, Conventional Commits) whether the commits since the last tag warrant one:
# fix/refactor/perf -> patch, feat -> minor, and while the version line is 0.x a breaking change
# is a minor too. When they do, the run
#   * creates the SSH-signed tag v<version> and the GitHub release with the notes
#     semantic-release writes from the commits (job tag),
#   * builds mowdeck.zip from that tag: the content of custom_components/mowdeck with the
#     release version in manifest.json, which is what HACS installs (hacs.json zip_release),
#   * attaches mowdeck.zip with SHA256SUMS, a Sigstore keyless bundle per file
#     (*.sigstore.json) and the GitHub build provenance (mowdeck-<version>.intoto.jsonl), and
#     adds the verification commands to the release notes (job publish).
# No file in the repository carries the release version (manifest.json stays at 0.0.0), so a
# release makes no commit. Nothing is published from a push whose commits are
# docs/ci/chore/test only. Never on pull requests.
on:
  push:
    branches: [main]

# One release chain at a time; a newer push waits instead of cancelling a release in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # @semantic-release/github's verifyConditions checks that the token may push (contents:
    # write), even in a dry run.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # ref: main (the branch tip), not the event SHA: semantic-release refuses to release from
      # a checkout that is behind the remote, and the real release in job tag is cut from the tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      # semantic-release runs from lukislp/ci-workflows' pinned toolchain (lock file in the
      # action) instead of a registry install per run or a package.json here.
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@3cc3111392db5b1b87d1b5b7dab634a96dbf6102 # v1.8.4
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      # Dry run: computes the next version from the commits since the last tag without tagging.
      # "No relevant changes" is the expected outcome for docs/ci/chore-only pushes.
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@3cc3111392db5b1b87d1b5b7dab634a96dbf6102 # v1.8.4
        with:
          dry-run: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        env:
          PUBLISHED: ${{ steps.semrel.outputs.new_release_published }}
          NEXT_VERSION: ${{ steps.semrel.outputs.new_release_version }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          release=false
          version=""
          if [ "$PUBLISHED" != true ]; then
            echo "No releasable commits since the last tag (docs, ci, chore, test only): nothing to publish. This is the common case, not a failure." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "main moved past this run's commit ($SHA): the newer push's run releases it." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            version="$NEXT_VERSION"
            # semantic-release starts a repository without tags at 1.0.0. This line starts at
            # 0.x from the initial tag v0.0.0 (CONTRIBUTING.md, "Releases"), so a missing tag is
            # a setup error, never a reason to publish 1.0.0.
            if [ -z "$(git tag --list 'v*')" ]; then
              echo "::error::no v* tag exists, so semantic-release would publish $version. Create the initial tag v0.0.0 first (CONTRIBUTING.md, 'Releases')."
              exit 1
            fi
            if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$version' is not a semantic version"
              exit 1
            fi
            # Signed releases: the tag is signed with DEPLOY_SIGNING_KEY, whose public half must
            # be a signing key of the owner's account, or GitHub shows the tag as unverified.
            if [ -z "$SIGNING_KEY" ]; then
              echo "::error::DEPLOY_SIGNING_KEY is not set: the release tag cannot be signed (CONTRIBUTING.md, 'Releases')."
              exit 1
            fi
            key="$RUNNER_TEMP/signing_key"
            printf '%s\n' "$SIGNING_KEY" > "$key"
            chmod 600 "$key"
            public="$(ssh-keygen -y -f "$key" | awk '{print $2}')"
            rm -f "$key"
            if ! gh api --paginate "users/$OWNER/ssh_signing_keys?per_page=100" --jq '.[].key' | grep -qF "$public"; then
              echo "::error::the public half of DEPLOY_SIGNING_KEY is not a signing key of $OWNER (github.com/settings/keys), so the tag would show as unverified."
              exit 1
            fi
            release=true
          fi
          {
            echo "version=$version"
            echo "release=$release"
          } | tee -a "$GITHUB_OUTPUT"

  # The real semantic-release run: the signed tag v<version> and the GitHub release with the
  # generated notes. The zip is built from that tag afterwards (job publish).
  tag:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # @semantic-release/github comments on the released pull requests and issues.
      issues: write
      pull-requests: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      # semantic-release tags the checked-out tip of main; job publish builds this run's commit
      # (github.sha). Both must be the same commit, or nothing is tagged.
      - name: The tip of main is this run's commit
        env:
          SHA: ${{ github.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$SHA" ]; then
            echo "::error::main moved to $head since this run started at $SHA; not tagging. The run of the newer push releases."
            exit 1
          fi
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@3cc3111392db5b1b87d1b5b7dab634a96dbf6102 # v1.8.4
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      # semantic-release creates its tag with a plain `git tag <name> <sha>`. With tag.gpgSign
      # git makes that an annotated tag signed with the SSH key; the "editor" writes the tag
      # message, and the tagger is the owner's noreply address, which GitHub needs to show
      # "Verified".
      - name: Sign the release tag with the SSH signing key
        env:
          SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
        run: |
          set -eu
          key="$RUNNER_TEMP/release_signing_key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          chmod 600 "$key"
          # git's SSH signing loads the public key from user.signingkey.
          ssh-keygen -y -f "$key" > "$key.pub"
          git config gpg.format ssh
          git config user.signingkey "$key.pub"
          git config tag.gpgSign true
          cat > "$RUNNER_TEMP/tag-message.sh" <<'EOF'
          #!/bin/sh
          printf 'MowDeck for Home Assistant %s\n' "$RELEASE_VERSION" > "$1"
          EOF
          chmod +x "$RUNNER_TEMP/tag-message.sh"
          {
            echo "GIT_EDITOR=$RUNNER_TEMP/tag-message.sh"
            echo "GIT_COMMITTER_NAME=mowdeck-release"
            echo "GIT_COMMITTER_EMAIL=155678024+lukislp@users.noreply.github.com"
          } >> "$GITHUB_ENV"
      - uses: lukislp/ci-workflows/.github/actions/semantic-release@3cc3111392db5b1b87d1b5b7dab634a96dbf6102 # v1.8.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Job publish builds this run's commit: make sure the tag exists on exactly that commit,
      # is signed and that GitHub verifies its signature.
      - name: Check the signed tag and the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          tag="v$RELEASE_VERSION"
          test "$(git cat-file -t "$tag")" = tag
          test "$(git rev-parse "$tag^{commit}")" = "$SHA"
          git cat-file -p "$tag" | grep -q 'BEGIN SSH SIGNATURE'
          gh release view "$tag" -R "$REPOSITORY" --json tagName --jq .tagName
          object="$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
          verified="$(gh api "repos/$REPOSITORY/git/tags/$object" --jq '.verification.verified')"
          reason="$(gh api "repos/$REPOSITORY/git/tags/$object" --jq '.verification.reason')"
          if [ "$verified" != true ]; then
            echo "::warning::GitHub does not show $tag as verified (reason: $reason)."
          fi
          echo "- signed tag \`$tag\` (verified: $verified)" >> "$GITHUB_STEP_SUMMARY"

  # Signed, verifiable release assets (OpenSSF Scorecard "Signed-Releases"): the HACS zip,
  # SHA256SUMS over it, a Sigstore keyless bundle per file and one GitHub build provenance
  # attestation, attached as mowdeck-<version>.intoto.jsonl.
  publish:
    needs: [version, tag]
    if: needs.version.outputs.release == 'true' && needs.tag.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build mowdeck.zip and SHA256SUMS
        run: |
          set -eu
          python3 scripts/build_release_zip.py --version "$VERSION" --out assets/mowdeck.zip
          (cd assets && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" assets/SHA256SUMS
          cat assets/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-checksums: assets/SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every asset (Sigstore keyless) and verify
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -eu
          for file in assets/*; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$file"
          done
          cp "$BUNDLE" "assets/mowdeck-$VERSION.intoto.jsonl"
      - name: Attach the assets and complete the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          tag="v$VERSION"
          gh release view "$tag" -R "$REPOSITORY" --json tagName --jq .tagName
          gh release upload "$tag" -R "$REPOSITORY" --clobber assets/*
          gh release view "$tag" -R "$REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "## Install"
            echo
            echo "HACS installs \`mowdeck.zip\` of this release (custom repository \`https://github.com/$REPOSITORY\`, type Integration). By hand: unpack it into \`<config>/custom_components/mowdeck/\` and restart Home Assistant."
            echo
            echo "## Verify"
            echo
            echo "Tag \`$tag\` is SSH-signed. Every file below has a Sigstore \`.sigstore.json\` bundle, \`SHA256SUMS\` lists them, and \`mowdeck-$VERSION.intoto.jsonl\` is their build provenance."
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify mowdeck.zip -R $REPOSITORY"
            echo "cosign verify-blob --bundle mowdeck.zip.sigstore.json \\"
            echo "  --certificate-identity https://github.com/$REPOSITORY/.github/workflows/release.yml@refs/heads/main \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com mowdeck.zip"
            echo '```'
          } >> notes.md
          gh release edit "$tag" -R "$REPOSITORY" --notes-file notes.md
          echo "- release \`$tag\` with $(find assets -type f | wc -l) assets" >> "$GITHUB_STEP_SUMMARY"
