name: release

# Publishes a release of the integration. Every push to main is looked at by the release module
# of the lktec-bot GitHub App (policy and rules: .github/lktec-bot.yml, documented in
# docs/modules/release.md of lukislp/lktec-bot). The version comes from the Conventional Commits
# since the highest v* tag: fix/refactor/perf -> patch, feat -> minor, and while the version line
# is 0.x a breaking change is a minor too. When the commits warrant a release, the run
#   * lets the App create the tag v<version> together with the GitHub release and its notes
#     through the GitHub API (job release). No deploy key and no semantic-release: the tag is
#     not SSH-signed, the assets are what is signed and attested,
#   * builds mowdeck.zip from that commit: the content of custom_components/mowdeck with the
#     release version in manifest.json, which is what HACS installs (hacs.json zip_release),
#   * attaches mowdeck.zip with SHA256SUMS, a Sigstore keyless bundle per file
#     (*.sigstore.json) and the GitHub build provenance (mowdeck-<version>.intoto.jsonl), and
#     adds the verification commands to the release notes (job publish).
# No file in the repository carries the release version (manifest.json stays at 0.0.0), so a
# release makes no commit. Nothing is published from a push whose commits are
# docs/ci/chore/test only. A run whose commit is no longer the tip of main is skipped: the run
# of the newer push releases it. Never on pull requests.
on:
  push:
    branches: [main]

# One release chain at a time; a newer push waits instead of cancelling a release in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # the reusable workflow looks up which commit of itself it was called at

jobs:
  release:
    uses: lukislp/lktec-bot/.github/workflows/release.yml@feeee04720178085ec24ffdf8083fc30aea2bedf # v0.9.0
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  # Signed, verifiable release assets (OpenSSF Scorecard "Signed-Releases"): the HACS zip,
  # SHA256SUMS over it, a Sigstore keyless bundle per file and one GitHub build provenance
  # attestation, attached as mowdeck-<version>.intoto.jsonl.
  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build mowdeck.zip and SHA256SUMS
        run: |
          set -eu
          python3 scripts/build_release_zip.py --version "$VERSION" --out assets/mowdeck.zip
          (cd assets && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" assets/SHA256SUMS
          cat assets/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-checksums: assets/SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign every asset (Sigstore keyless) and verify
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -eu
          for file in assets/*; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$file"
          done
          cp "$BUNDLE" "assets/mowdeck-$VERSION.intoto.jsonl"
      - name: Attach the assets and complete the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          tag="v$VERSION"
          gh release view "$tag" -R "$REPOSITORY" --json tagName --jq .tagName
          gh release upload "$tag" -R "$REPOSITORY" --clobber assets/*
          gh release view "$tag" -R "$REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "## Install"
            echo
            echo "HACS installs \`mowdeck.zip\` of this release (custom repository \`https://github.com/$REPOSITORY\`, type Integration). By hand: unpack it into \`<config>/custom_components/mowdeck/\` and restart Home Assistant."
            echo
            echo "## Verify"
            echo
            echo "Tag \`$tag\` was created by the lktec-bot GitHub App through the GitHub API. Every file below has a Sigstore \`.sigstore.json\` bundle, \`SHA256SUMS\` lists them, and \`mowdeck-$VERSION.intoto.jsonl\` is their build provenance."
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify mowdeck.zip -R $REPOSITORY"
            echo "cosign verify-blob --bundle mowdeck.zip.sigstore.json \\"
            echo "  --certificate-identity https://github.com/$REPOSITORY/.github/workflows/release.yml@refs/heads/main \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com mowdeck.zip"
            echo '```'
          } >> notes.md
          gh release edit "$tag" -R "$REPOSITORY" --notes-file notes.md
          echo "- release \`$tag\` with $(find assets -type f | wc -l) assets" >> "$GITHUB_STEP_SUMMARY"
