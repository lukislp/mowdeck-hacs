# Home Assistant custom integration "MowDeck" (HACS). A standalone uv project: HACS installs
# only custom_components/mowdeck; nothing here is published to PyPI.
[project]
name = "mowdeck-home-assistant"
version = "0.0.0"
description = "Home Assistant custom integration for MowDeck (HACS)."
requires-python = ">=3.14.2,<3.15"
license = { text = "AGPL-3.0-only" }

[tool.uv]
package = false

[dependency-groups]
dev = [
  # pytest-homeassistant (home-assistant/core, packages/pytest-homeassistant) pins the matching
  # homeassistant release exactly, so both move together.
  "homeassistant==2026.11.0",
  "pytest-homeassistant==2026.11.0",
  # The camera platform imports PyTurboJPEG (a requirement of the camera component).
  "PyTurboJPEG==1.8.3",
  # pytest-homeassistant does not depend on pytest-cov (the old harness did).
  "pytest-cov>=7.0.0",
  "mypy>=1.13.0",
  "ruff>=0.8.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# `-p no:respx`: Home Assistant installs its httpx alias before respx is imported (asked for by
# the pytest-homeassistant README).
addopts = "-ra -p no:respx"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["custom_components/mowdeck"]

[tool.coverage.report]
# Home Assistant's Silver quality scale asks for more than 95 % (quality_scale.yaml).
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.14"
files = ["custom_components/mowdeck", "tests", "scripts"]
# custom_components has no __init__.py (HACS ships only custom_components/mowdeck).
mypy_path = "."
explicit_package_bases = true
strict = true
# Home Assistant's base classes declare cached properties and generics that mypy's strict
# mode flags in subclasses (for example `_attr_*` overrides); see the docs for the rationale.
warn_return_any = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
# Home Assistant's component packages re-export their public names without __all__
# (for example `from homeassistant.components.lawn_mower import LawnMowerEntity`).
implicit_reexport = true

# The test harness ships no type information.
[[tool.mypy.overrides]]
module = ["pytest_homeassistant.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
