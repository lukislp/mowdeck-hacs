# Home Assistant custom integration "MowDeck" (HACS). A standalone uv project: HACS installs
# only custom_components/mowdeck; nothing here is published to PyPI.
[project]
name = "mowdeck-home-assistant"
version = "0.0.0"
description = "Home Assistant custom integration for MowDeck (HACS)."
requires-python = ">=3.14.2,<3.15"
license = { text = "AGPL-3.0-only" }

[tool.uv]
package = false
# homeassistant 2026.10.x pins Pillow==12.3.0 and uv==0.12.23 exactly; both have published
# security advisories fixed in Pillow 13.0.0 and uv 0.13.4. Dev/test environment only (HACS
# ships just custom_components/mowdeck). Drop once Home Assistant bumps its pins.
override-dependencies = ["pillow>=13.0.0", "uv>=0.13.4"]

[dependency-groups]
dev = [
  # pytest-homeassistant-custom-component pins the matching homeassistant release exactly.
  "homeassistant==2026.10.0",
  "pytest-homeassistant-custom-component==0.13.371",
  # The camera platform imports PyTurboJPEG (a requirement of the camera component).
  "PyTurboJPEG==1.8.3",
  "mypy>=1.13.0",
  "ruff>=0.8.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["custom_components/mowdeck"]

[tool.coverage.report]
# Home Assistant's Silver quality scale asks for more than 95 % (quality_scale.yaml).
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.14"
files = ["custom_components/mowdeck", "tests", "scripts"]
# custom_components has no __init__.py (HACS ships only custom_components/mowdeck).
mypy_path = "."
explicit_package_bases = true
strict = true
# Home Assistant's base classes declare cached properties and generics that mypy's strict
# mode flags in subclasses (for example `_attr_*` overrides); see the docs for the rationale.
warn_return_any = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
# Home Assistant's component packages re-export their public names without __all__
# (for example `from homeassistant.components.lawn_mower import LawnMowerEntity`).
implicit_reexport = true

# The test harness ships no type information.
[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
